<div class="relative min-w-full block max-w-sm rounded-base shadow-xs block p-4 overflow-hidden">
    <div class="relative w-full h-full">
        <div
            class="absolute inset-0 z-10 rounded-[8px] transition-all duration-200"
            [class.pointer-events-none]="!editMode"
            [class.cursor-pointer]="editMode"
            [class.bg-black/10]="selected && editMode"
            [class.border-2]="selected && editMode"
            [class.border-white/40]="selected && editMode"
            (click)="handleSelectionClick($event)"
        ></div>
        <iframe class="bg-neutral-primary-soft border-default border w-full h-full" [src]="safeUrl" frameborder="0" style="border-radius: 8px; min-height: 318px;"></iframe>
    </div>
</div>
