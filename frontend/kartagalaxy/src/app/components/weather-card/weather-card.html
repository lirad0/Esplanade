<div class="min-w-full block max-w-sm rounded-base shadow-xs block p-4 overflow-hidden">
    <iframe class="bg-neutral-primary-soft border-default border w-full h-full" [src]="safeUrl" frameborder="0" style="border-radius: 8px; min-height: 318px;"></iframe>
    @if (editMode) {
        <div class="mt-3 flex justify-end">
            <button type="button" class="flex items-center gap-2 rounded-xl bg-red-600 px-3 py-2 text-white" (click)="handleDelete()">
                <img src="ui/delete.svg" alt="Delete" class="h-4 w-4" />
                Delete
            </button>
        </div>
    }
</div>
